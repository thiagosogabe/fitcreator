<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrigado! - FitCreator AI</title>
  <!-- Pixel do Facebook -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '4247280335521120');
    fbq('track', 'PageView');

    // Dispara o evento de compra
    var params = new URLSearchParams(window.location.search);
    var transactionId = params.get('transaction') || 'purchase_' + Date.now();

    fbq('track', 'Purchase', {
      value: 47.00,
      currency: 'BRL',
      content_name: 'FitCreator Pro',
    }, { eventID: transactionId });

    // Avisa o servidor também (Conversions API)
    fetch('/api/meta-purchase', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        transactionId: transactionId,
        email: params.get('email') || '',
        value: 47.00,
        currency: 'BRL',
        eventSourceUrl: window.location.href,
        userAgent: navigator.userAgent,
      })
    });
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f0f; color: #fff; font-family: sans-serif; padding: 2rem; text-align: center; }
    .icon { width: 80px; height: 80px; border-radius: 50%; background: #00c97b; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.5rem; }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { color: #a0a0a0; max-width: 400px; line-height: 1.6; margin-bottom: 2rem; }
    .beneficios { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 1.5rem; max-width: 380px; width: 100%; margin-bottom: 2rem; text-align: left; }
    .beneficios div { padding: 6px 0; font-size: 0.95rem; }
    a.btn { display: inline-block; background: #00c97b; color: #fff; text-decoration: none; padding: 14px 36px; border-radius: 12px; font-weight: 600; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="icon">✓</div>
  <h1>Bem-vindo ao FitCreator Pro! 🎉</h1>
  <p>Sua assinatura foi confirmada. Você agora tem acesso completo a todas as ferramentas Pro.</p>
  <div class="beneficios">
    <div>🔥 Trends da Semana</div>
    <div>🎵 Músicas em Alta</div>
    <div>📊 Score Viral</div>
    <div>🎬 Série de 5 Vídeos</div>
    <div>⚡ Hooks Virais ilimitados</div>
    <div>🏆 Desafio 30 Dias completo</div>
  </div>
  <a class="btn" href="/">Acessar o App →</a>
</body>
</html>
